<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Recovery Pro - Deep Ocean Hydro</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-ocean: #031329;
      --card-navy: #0b1d3a;
      --border-cyan: rgba(6, 182, 212, 0.25);
      --accent-cyan: #06b6d4;
      --cyan-light: #22d3ee;
      --gold-accent: #f59e0b;
      --text-white: #f8fafc;
      --text-slate: #94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    /* 1. DEEP OCEAN HYDRO BACKGROUND & ANIMATED LIGHT PULSE */
    body {
      background: radial-gradient(circle at 50% 0%, #0d284f 0%, var(--bg-ocean) 85%);
      background-size: 200% 200%;
      animation: hydroPulse 12s ease infinite;
      color: var(--text-white);
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @keyframes hydroPulse {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* 2. CARD ANIMATION & HOVER SHADOWS */
    .hydro-card {
      background: var(--card-navy);
      border: 1px solid var(--border-cyan);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hydro-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(6, 182, 212, 0.25);
      border-color: var(--cyan-light);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 3. INPUT LOCKS & CYBER BUTTON GLOW */
    .cyber-input {
      background: rgba(3, 19, 41, 0.85);
      border: 1px solid var(--border-cyan);
      color: #ef4444;
      font-weight: 800;
      letter-spacing: 1.5px;
      transition: all 0.25s ease;
      min-height: 48px;
    }

    .cyber-input:focus {
      outline: none;
      border-color: var(--cyan-light);
      box-shadow: 0 0 0 2px var(--accent-cyan);
    }

    .btn-cyber {
      background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
      transition: all 0.25s ease;
      min-height: 48px;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .btn-cyber:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
    }

    .btn-cyber:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(80%);
    }

    /* 4. HACKER TV TERMINAL CONSOLE */
    .tv-terminal {
      background: #020b14;
      border: 2px solid var(--accent-cyan);
      box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.3), 0 0 20px rgba(6, 182, 212, 0.2);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      font-family: 'Fira Code', monospace;
    }

    .tv-terminal::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    .terminal-logs {
      color: #00ff66;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.8);
      font-size: 0.85rem;
      line-height: 1.6;
      max-height: 160px;
      overflow-y: auto;
    }

    /* 5. PRINT MODE PROTOCOLS */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .hydro-card {
        border: 1px solid #ccc !important;
        box-shadow: none !important;
        background: #ffffff !important;
      }
      .no-print, button, input, .tv-terminal, .dropzone {
        display: none !important;
      }
      #resultBox {
        display: block !important;
        color: #000000 !important;
      }
    }
  </style>
</head>
<body>

  <div class="w-full max-w-2xl mx-auto space-y-5">

    <!-- HEADER PANEL -->
    <div class="hydro-card p-6 text-center">
      <h1 class="text-3xl md:text-4xl font-black tracking-widest text-amber-400 drop-shadow-md">
        ULTRA RECOVERY PRO
      </h1>
      <p class="text-xs md:text-sm text-slate-300 mt-2 font-medium tracking-wide">
        💎 Managed by: <span class="text-amber-400 font-bold tracking-wider">VIKAS MISHRA</span>
      </p>
    </div>

    <!-- RECOVERY CONFIG CARD -->
    <div class="hydro-card p-6 space-y-5">
      
      <!-- MODE SELECTION -->
      <div>
        <div class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-3">
          ⚙️ RECOVERY MODE SELECTION
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <label class="flex items-center gap-3 p-3.5 rounded-xl bg-slate-900/80 border border-cyan-500/20 cursor-pointer hover:border-cyan-400 transition">
            <input type="radio" name="recovery_mode" value="name_digits" checked onchange="toggleMode()" class="w-4 h-4 accent-cyan-400">
            <span class="text-amber-300 font-bold text-sm">Name + 4 Digits</span>
          </label>
          <label class="flex items-center gap-3 p-3.5 rounded-xl bg-slate-900/80 border border-cyan-500/20 cursor-pointer hover:border-cyan-400 transition">
            <input type="radio" name="recovery_mode" value="numeric_8" onchange="toggleMode()" class="w-4 h-4 accent-cyan-400">
            <span class="text-amber-300 font-bold text-sm">8-Digit Numbers Only</span>
          </label>
        </div>
      </div>

      <!-- FILE UPLOAD DROPZONE -->
      <div>
        <div class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-2">
          📄 UPLOAD ENCRYPTED PDF
        </div>
        <div class="dropzone relative flex flex-col items-center justify-center p-6 border-2 border-dashed border-cyan-500/40 rounded-xl bg-cyan-950/10 hover:bg-cyan-950/20 transition cursor-pointer">
          <i class="fa-solid fa-file-pdf text-4xl text-cyan-400 mb-2"></i>
          <span class="text-sm text-slate-300 font-semibold" id="fileNameDisplay">Drop PDF here or click to browse</span>
          <input type="file" id="pdfFileInput" accept="application/pdf" class="absolute inset-0 opacity-0 cursor-pointer" onchange="handleFileSelect(event)">
        </div>
      </div>

      <!-- NAME HINT INPUT -->
      <div id="hintContainer" class="space-y-2">
        <div class="text-xs font-bold text-cyan-400 uppercase tracking-widest">
          💡 NAME HINT
        </div>
        <input 
          type="text" 
          id="nameHintInput" 
          placeholder="TYPE NAME HINT (E.G. VIKAS)" 
          class="cyber-input w-full px-4 rounded-xl text-lg uppercase"
          oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()"
        >
      </div>

      <!-- EXECUTE BUTTON -->
      <button id="executeBtn" onclick="runRecoveryProcess()" class="btn-cyber w-full py-3.5 rounded-xl text-white font-black text-base md:text-lg flex items-center justify-center gap-3">
        <i class="fa-solid fa-rocket text-amber-300"></i>
        <span id="btnText">EXECUTE RECOVERY ENGINE</span>
      </button>

    </div>

    <!-- HACKER TV TERMINAL SCREEN -->
    <div id="terminalPanel" class="hydro-card p-4 space-y-3" style="display: none;">
      <div class="flex items-center justify-between text-xs text-cyan-400 font-mono px-1">
        <span><i class="fa-solid fa-terminal"></i> RECOVERY MATRIX MONITOR</span>
        <span class="animate-pulse text-emerald-400">● ENGINE ACTIVE</span>
      </div>
      <div class="tv-terminal p-4">
        <div id="terminalLogs" class="terminal-logs space-y-1">
          <div>> [SYSTEM_INIT] Booting Deep Ocean Recovery Core v2026...</div>
        </div>
      </div>
    </div>

    <!-- RESULT & DOWNLOAD PANEL -->
    <div id="resultBox" class="hydro-card p-6 text-center space-y-4" style="display: none;">
      <div class="text-emerald-400 font-black text-2xl tracking-wide animate-bounce">
        🔓 VERIFIED FOUND: <span id="foundPasswordDisplay" class="text-amber-300 underline">--</span>
      </div>
      <button id="downloadBtn" onclick="downloadUnlockedPDF()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-lg rounded-xl shadow-lg transition duration-200">
        📥 DOWNLOAD UNLOCKED PDF
      </button>
    </div>

  </div>

  <script>
    let selectedFile = null;
    let cachedPassword = null;

    // IFRAME DYNAMIC HEIGHT AUTO-RESIZER
    function sendDynamicHeight() {
      if (window.parent) {
        window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight }, '*');
      }
    }
    window.addEventListener('resize', sendDynamicHeight);
    window.addEventListener('load', () => {
      sendDynamicHeight();
      checkLocalStorageCache();
    });

    function toggleMode() {
      const mode = document.querySelector('input[name="recovery_mode"]:checked').value;
      document.getElementById('hintContainer').style.display = (mode === 'name_digits') ? 'block' : 'none';
      sendDynamicHeight();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        selectedFile = file;
        document.getElementById('fileNameDisplay').innerText = file.name;
        document.getElementById('fileNameDisplay').classList.add('text-cyan-300');
      }
    }

    function addLog(message) {
      const logsContainer = document.getElementById('terminalLogs');
      const logLine = document.createElement('div');
      logLine.innerText = `> ${message}`;
      logsContainer.appendChild(logLine);
      logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    // 7-SECOND ACTION COOLDOWN
    function applyCooldown() {
      const btn = document.getElementById('executeBtn');
      const btnText = document.getElementById('btnText');
      btn.disabled = true;
      let secondsLeft = 7;

      const countdown = setInterval(() => {
        secondsLeft--;
        btnText.innerText = `COOLDOWN ACTIVE (${secondsLeft}s)`;
        if (secondsLeft <= 0) {
          clearInterval(countdown);
          btn.disabled = false;
          btnText.innerText = "EXECUTE RECOVERY ENGINE";
        }
      }, 1000);
    }

    function runRecoveryProcess() {
      if (!selectedFile) {
        alert("Please select an encrypted PDF file first!");
        return;
      }

      applyCooldown();

      const terminalPanel = document.getElementById('terminalPanel');
      const resultBox = document.getElementById('resultBox');
      const logsContainer = document.getElementById('terminalLogs');
      
      logsContainer.innerHTML = "<div>> [SYSTEM_INIT] Booting Deep Ocean Recovery Core v2026...</div>";
      terminalPanel.style.display = 'block';
      resultBox.style.display = 'none';
      sendDynamicHeight();

      const mode = document.querySelector('input[name="recovery_mode"]:checked').value;
      const hint = document.getElementById('nameHintInput').value.trim().toUpperCase();

      addLog(`RECOVERY MODE: ${mode === 'name_digits' ? 'NAME + 4 DIGITS' : '8-DIGIT NUMERIC'}`);
      if (hint) addLog(`APPLYING NAME HINT: ${hint}`);
      addLog("DECRYPTION MATRIX RUNNING IN BACKEND ENGINE...");

      setTimeout(() => {
        const dummyPass = hint ? `${hint.substring(0, 4)}2004` : "12345678";
        cachedPassword = dummyPass;

        addLog(`[SUCCESS] PDF UNLOCKED SUCCESSFULLY!`);
        addLog(`FOUND KEY: ${dummyPass}`);

        document.getElementById('foundPasswordDisplay').innerText = dummyPass;
        resultBox.style.display = 'block';

        localStorage.setItem('last_recovered_pass', dummyPass);
        sendDynamicHeight();
      }, 1800);
    }

    function checkLocalStorageCache() {
      const lastPass = localStorage.getItem('last_recovered_pass');
      if (lastPass) {
        console.log("Cached password restored:", lastPass);
      }
    }

    function downloadUnlockedPDF() {
      if (!selectedFile) return;
      alert(`Downloading unlocked file with key: ${cachedPassword}`);
    }
  </script>

</body>
</html>
